plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = project.mod_version
base.archivesName = 'diaithir-bestiary-neoforge-26.1.2'
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version
    mods { diaithirbestiary { sourceSet(sourceSets.main) } }
}

processResources {
    inputs.property 'version', version
    filesMatching('META-INF/neoforge.mods.toml') { expand(version: version) }
}

repositories {
    exclusiveContent {
        forRepository { maven { url 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    compileOnly 'maven.modrinth:geckolib:xfVfPcoC'
}
