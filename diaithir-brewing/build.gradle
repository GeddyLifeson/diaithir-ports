plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = project.mod_version
base.archivesName = 'diaithir-brewing-neoforge-26.1.2'
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version
    runs {
        client {
            client()
            jvmArgument '-Xmx3G'
            jvmArgument '-Djava.net.preferIPv4Stack=true'
            programArguments.addAll '--username', 'Tester', '--quickPlayMultiplayer', 'localhost:25565'
        }
        server {
            server()
            programArgument '--nogui'
        }
    }
    mods { diaithirbrewing { sourceSet(sourceSets.main) } }
}

processResources {
    inputs.property 'version', version
    filesMatching('META-INF/neoforge.mods.toml') { expand(version: version) }
}

repositories {
    mavenCentral()
}

