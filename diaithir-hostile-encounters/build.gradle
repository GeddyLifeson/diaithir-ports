plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = project.mod_version
base.archivesName = 'diaithir-hostile-encounters-neoforge-26.1.2'
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version
    runs {
        selftest {
            server()
            programArgument '--nogui'
            systemProperty 'lunarselftest', 'true'
        }
        server {
            server()
            programArgument '--nogui'
        }
    }
    mods { diaithirhostile { sourceSet(sourceSets.main) } }
}

processResources {
    inputs.property 'version', version
    filesMatching('META-INF/neoforge.mods.toml') { expand(version: version) }
}

repositories {
    mavenCentral()
}
