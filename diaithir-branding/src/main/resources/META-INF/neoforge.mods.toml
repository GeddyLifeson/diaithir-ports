[[mods]]
modId = "diaithirbranding"
version = "${version}"
displayName = "Diaithir"
description = "Diaithir's look on the client: the title wordmark, splash lines, Pixelify Sans as the game font, the loading screen, the window title, and help buttons that lead to the pack's own help page instead of Realms and Mojang feedback. Client only; servers do not need it."
displayTest = "IGNORE_ALL_VERSION"

[[mixins]]
config = "diaithirbranding.mixins.json"

[[dependencies.diaithirbranding]]
