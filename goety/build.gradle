plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = project.mod_version
base.archivesName = 'goety-neoforge-26.1.2'
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version
    runs {
        server {
            server()
            programArgument '--nogui'
        }
    }
    mods { goety { sourceSet(sourceSets.main) } }
}

processResources {
    inputs.property 'version', version
    filesMatching('META-INF/neoforge.mods.toml') { expand(version: version) }
}

repositories {
    mavenCentral()
}

dependencies {
    // Curios and GeckoLib jars of the pack (libs/ is not committed; copy from the pack's mods folder).
    compileOnly files('libs/curios.jar')
    compileOnly files('libs/geckolib.jar')
    runtimeOnly files('libs/curios.jar')
    runtimeOnly files('libs/geckolib.jar')
}
