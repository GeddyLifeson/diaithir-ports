plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = project.mod_version
base.archivesName = 'diaithir-immersive-tanning-neoforge-26.1.2'
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version
    runs {
        server {
            server()
            programArgument '--nogui'
        }
    }
    mods { immersive_tanning { sourceSet(sourceSets.main) } }
}

processResources {
    inputs.property 'version', version
    filesMatching('META-INF/neoforge.mods.toml') { expand(version: version) }
}

repositories {
    mavenCentral()
}


sourceSets.main.java.exclude 'com/otectus/immersivetanning/client/screen/**', 'com/otectus/immersivetanning/client/renderer/**', 'com/otectus/immersivetanning/client/ClientEffects.java', 'com/otectus/immersivetanning/client/ClientEvents.java', 'com/otectus/immersivetanning/client/ClientSetup.java', 'com/otectus/immersivetanning/client/StationNotices.java'

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xmaxerrs', '5000']
}
