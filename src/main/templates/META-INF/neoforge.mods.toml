modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/RayTrace082/untamedwilds/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/RayTrace082/untamedwilds/"
logoFile="logo.png"
authors="${mod_authors}"
credits="Citadel animation and model classes by Alexthe666, iLexiconn and gegy1000, vendored via Alex's Mobs Continued"
description='''Expanding on the natural world of Minecraft.'''

[[dependencies.${mod_id}]]
