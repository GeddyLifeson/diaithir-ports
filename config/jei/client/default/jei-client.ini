# Diaithir default for JEI's search index. JEI builds the index from every ingredient (about 45k in this pack), and tooltip
# search fires ItemTooltipEvent for each one, which made the first JEI start slow and heap hungry. Name and mod-name search stay on.
# Keys and values checked against jei-26.1.2-neoforge-29.47.0.109 (IngredientFilterConfig: search category, SearchMode ENABLED / REQUIRE_PREFIX / DISABLED).
[search]
tooltipSearchMode = DISABLED
tagSearchMode = DISABLED
creativeTabSearchMode = DISABLED
identifierSearchMode = DISABLED
colorSearchMode = DISABLED
