# Diaithir: only the keys the pack sets; Distant Horizons fills in every other key with its default on first start.
[common.multiThreading]
	# the dedicated server runs one DH pool set per dimension and there are 72 backrooms dimensions
	numberOfThreads = 1

[common.logging]
	logWorldGenEventToFile = "DISABLED"
	logWorldGenChunkLoadEventToFile = "DISABLED"

[common.worldGenerator]
	showGenerationProgress = "DISABLED"
	# Tellus terrain is not what the rough-surface estimator expects (seam walls, hollow shells, floating terrain): build LODs from real chunk generation
	generatorPlan = "CHUNKS_ONLY"

[client.advanced.graphics.experimental]
