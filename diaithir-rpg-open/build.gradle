plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = project.mod_version
base.archivesName = 'diaithir-rpg-open-neoforge-26.1.2'
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version
    accessTransformers.from('src/main/resources/META-INF/accesstransformer.cfg')
    runs {
        server {
            server()
            programArgument '--nogui'
        }
    }
    mods {
        placebo { sourceSet(sourceSets.main) }
        apothic_attributes { sourceSet(sourceSets.main) }
        apothic_enchanting { sourceSet(sourceSets.main) }
        apothic_spawners { sourceSet(sourceSets.main) }
        apotheosis { sourceSet(sourceSets.main) }
    }
}

processResources {
    inputs.property 'version', version
    filesMatching('META-INF/neoforge.mods.toml') { expand(version: version) }
}

repositories {
    mavenCentral()
    maven { url 'https://maven.theillusivec4.top' }
    maven { url 'https://maven.blamejared.com' }
}

dependencies {
    implementation 'top.theillusivec4.curios:curios-neoforge:15.0.0-beta.2+26.1.2'
    compileOnly 'vazkii.patchouli:patchouli-neoforge:26.1-94'
}
