plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

// LGPL-3.0 module, ported from Ars Nouveau (code only). Compiled classes are folded into the diaithir-druidry jar by ../build.py.
version = project.mod_version
base.archivesName = 'diaithir-druidry-ars-neoforge-26.1.2'
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version
    mods { diaithir_druidry { sourceSet(sourceSets.main) } }
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly 'org.jetbrains:annotations:24.1.0'
}

tasks.withType(JavaCompile).configureEach { options.compilerArgs += ['-Xmaxerrs', '100000'] }
