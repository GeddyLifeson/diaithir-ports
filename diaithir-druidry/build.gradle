plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = project.mod_version
base.archivesName = 'diaithir-druidry-neoforge-26.1.2'
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Botania (Botania License, copyleft) lives under botania/ with its own LICENSE.txt.
// Active sources: botania/src/main/java; not yet ported ones wait in botania/pending/java.
sourceSets.main.java.srcDir 'botania/src/main/java'
sourceSets.main.resources.srcDir 'botania/src/main/resources'

neoForge {
    version = project.neo_version
    runs {
        server {
            server()
            programArgument '--nogui'
        }
    }
    mods {
        diaithir_druidry { sourceSet(sourceSets.main) }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly 'org.jetbrains:annotations:24.1.0'
}

tasks.withType(JavaCompile).configureEach { options.compilerArgs += ["-Xmaxerrs","20000"] }

processResources {
    inputs.property 'version', project.mod_version
    inputs.property 'bootTest', project.hasProperty('bootTest')
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(version: project.mod_version)
        // -PbootTest drops the Spell Engine dependencies so the module boots alone in a dev server
        if (project.hasProperty('bootTest')) { def cut = false; filter { if (it.startsWith('[[dependencies')) cut = true; cut ? null : it } }
    }
}
