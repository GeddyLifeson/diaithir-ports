plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = project.mod_version
base.archivesName = 'diaithir-tooltips-neoforge-26.1.2'
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version
    runs {
        client {
            client()
            if (project.hasProperty('join')) programArguments.addAll('--quickPlayMultiplayer', project.property('join'))
        }
        server {
            server()
            programArguments.add('--nogui')
        }
    }
    mods { diaithirtooltips { sourceSet(sourceSets.main) } }
}

processResources {
    inputs.property 'version', version
    filesMatching('META-INF/neoforge.mods.toml') { expand(version: version) }
}
