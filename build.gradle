plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = "${minecraft_version}-${mod_version}"
group = 'com.zurrtum'

base { archivesName = 'create-neoforge' }

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.shedaniel.me/' }
}

neoForge {
    version = project.neo_version
    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')
    interfaceInjectionData.from(file('interfaces.json'))
    runs {
        server { server() }
        client { client() }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

sourceSets {
    main {
        java {
            exclude 'com/zurrtum/create/compat/computercraft/implementation/**'
            exclude 'com/zurrtum/create/compat/computercraft/AllComputerPeripherals.java'
            exclude 'com/zurrtum/create/compat/computercraft/ComputerIntegration.java'
            exclude 'com/zurrtum/create/compat/computercraft/AllComputerDisplaySource.java'
            exclude 'com/zurrtum/create/compat/eiv/**'
            exclude 'com/zurrtum/create/compat/rei/**'
            exclude 'com/zurrtum/create/compat/fabric/**'
            exclude 'com/zurrtum/create/compat/trinkets/**'
            exclude 'com/zurrtum/create/client/compat/eiv/**'
            exclude 'com/zurrtum/create/client/compat/jei/**'
            exclude 'com/zurrtum/create/client/compat/rei/**'
            exclude 'com/zurrtum/create/client/compat/rrv/**'
            exclude 'com/zurrtum/create/client/compat/fabric/**'
            exclude 'com/zurrtum/create/client/compat/trinkets/**'
            exclude 'com/zurrtum/create/mixin/ArchitecturyMixin.java'
            exclude 'com/zurrtum/create/client/mixin/Iris*'
            exclude 'com/zurrtum/create/client/mixin/Rrv*'
            exclude 'com/zurrtum/create/client/mixin/Eiv*'
            exclude 'com/zurrtum/create/client/mixin/FabricEIVMixin.java'
            exclude 'com/zurrtum/create/client/mixin/BuiltInReliableRecipeViewerClientIntegrationMixin.java'
            exclude 'com/zurrtum/create/client/mixin/QuadRenderHelperMixin.java'
            exclude 'com/zurrtum/create/client/mixin/ConnectedTextureBehaviourMixin.java'
            exclude 'com/zurrtum/create/client/mixin/Copycat*Mixin.java'
            exclude 'com/zurrtum/create/client/mixin/WrapperBlockStateModel*Mixin.java'
            exclude 'com/zurrtum/create/client/mixin/WrapperBlockStateModelAccessor.java'
            exclude 'com/zurrtum/create/client/mixin/ModelRenderHelperMixin.java'
            exclude 'com/zurrtum/create/client/mixin/ItemModelRenderHelperMixin.java'
            exclude 'com/zurrtum/create/client/mixin/Buffer*EmitterMixin.java'
            exclude 'com/zurrtum/create/client/mixin/SymmetryWandModelMixin.java'
        }
    }
}

dependencies {
    // compile-time only: referenced by code paths that the NeoForge build never takes (see MixinPlugin)
    compileOnly 'net.fabricmc.fabric-api:fabric-renderer-api-v1:13.0.3+c80601bb4c'
    compileOnly 'net.fabricmc.fabric-api:fabric-api-base:2.0.3+ece063234c'
    compileOnly 'net.fabricmc.fabric-api:fabric-model-loading-api-v1:8.0.6+c80601bb4c'
    compileOnly 'net.fabricmc:fabric-loader:0.19.2'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '100000']
}

tasks.named('jar', Jar) {
    from('LICENSE.md')
    from('licenses') { into 'licenses' }
}
