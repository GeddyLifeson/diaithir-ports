import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    // com.gradleup.shadow is the Gradle 9-compatible successor to the unmaintained
    // com.github.johnrengelman.shadow.
    id "com.gradleup.shadow" version "9.5.1"
    id "com.matthewprenger.cursegradle"
    id "com.modrinth.minotaur"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
    // loom-no-remap: MC 26.2 is unobfuscated, so there is no refmap and no legacy mixin AP config.
    // Mixin configs are declared in neoforge.mods.toml ([[mixins]]) instead of loom.forge{}.
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin because we don't want IDEA to index this.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

dependencies {
    implementation(annotationProcessor("io.github.llamalad7:mixinextras-common:$mixin_extras_version"))

    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    // VS2 26.2 fork forge (published to mavenLocal; plain main jar which shades vs-core). transitive
    // false so we control exactly what reaches the runtime classpath.
    implementation("org.valkyrienskies:valkyrienskies-26-2-forge:${rootProject.vs2_version}") { transitive = false }

    // vs-core must be on the dev RUNTIME classpath too: the VS2 fork's published forge jar does
    // NOT shade it (its POM carries vs-core as runtime-scope deps, which the transitive=false
    // above cuts off). Launching without it dies in the architectury transformer with
    // ClassNotFoundException: org.valkyrienskies.core.api.ships.* while computing stack frames.
    // Mirrors vs2-core/forge/build.gradle (joml excluded - Minecraft provides it).
    implementation("org.valkyrienskies.core:api:${rootProject.vs_core_version}")
    implementation("org.valkyrienskies.core:util:${rootProject.vs_core_version}")
    implementation("org.valkyrienskies.core:internal:${rootProject.vs_core_version}") {
        exclude group: 'org.joml', module: 'joml'
    }
    runtimeOnly("org.valkyrienskies.core:impl:${rootProject.vs_core_version}") {
        exclude group: 'org.joml', module: 'joml'
    }

    // Kotlin for Forge (NeoForge)
    implementation("thedarkcolour:kotlinforforge-neoforge:${rootProject.kotlin_for_forge_version}")

    // Cloth config (NeoForge)
    include(implementation("me.shedaniel.cloth:cloth-config-neoforge:${rootProject.cloth_config_version}"))

    common(project(path: ":common")) { transitive = false }
    shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive = false }
}

tasks.runClient.configure {
    jvmArgs '-Dkotlinx.coroutines.debug=off'
}
tasks.runServer.configure {
    jvmArgs '-Dkotlinx.coroutines.debug=off'
}

// Copy the common access widener into generated resources so processResources picks it up.
def generatedResourcesDir = layout.buildDirectory.dir("generated/resources")

tasks.register("copyAccessWidener", Copy) {
    from(project(":common").file("src/main/resources/vs_eureka.accesswidener"))
    into(generatedResourcesDir)
}

sourceSets {
    main {
        resources {
            srcDir generatedResourcesDir
        }
        // TODO Phase 5: unreferenced datagen scaffolding; the old-Forge BlockTagsProvider/
        // ExistingFileHelper datagen APIs it uses were reworked in NeoForge 26.2. Port it if
        // datagen is ever wired up again.
        kotlin {
            exclude "org/valkyrienskies/eureka/forge/EurekaBlockTagsProvider.kt"
        }
        java {
            exclude "org/valkyrienskies/eureka/forge/EurekaBlockTagsProvider.kt"
        }
    }
}

processResources {
    dependsOn("copyAccessWidener")
    inputs.property "version", project.version
    inputs.property "vs2_version", project.vs2_version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand "version": project.version,
            "vs2_version": (project.vs2_version.contains('+') ? project.vs2_version.substring(0, project.vs2_version.indexOf('+')) : project.vs2_version)
    }
}

// loom-no-remap: remapJar is gone (nothing to remap). The raw `jar` becomes an intermediate and
// `shadowJar` (which shades in the transformed common classes) becomes the main artifact.
jar {
    archiveClassifier.set "raw"
}

shadowJar {
    dependsOn jar
    mainSpec.sourcePaths.clear()
    from(zipTree(tasks.named("jar").get().archiveFile))

    exclude "fabric.mod.json"
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set null
}

build.dependsOn shadowJar

java.toolchain.languageVersion = JavaLanguageVersion.of(25)
// Kotlin has no JVM_25 target yet; 21 bytecode runs fine under JVM 25.
compileKotlin.compilerOptions.jvmTarget = JvmTarget.JVM_21

// @Mod object dev-launch fix (identical to the VS2 fork): architectury-loom's dev "main" mod
// classpath group only contains build/classes/java/main and omits build/classes/kotlin/main, so
// FML fails to find the Kotlin @Mod object EurekaModForge. Emitting Kotlin classes into the Java
// output dir makes the @Mod object present in whichever group FML selects.
compileKotlin.destinationDirectory.set(compileJava.destinationDirectory)

sourcesJar {
    dependsOn("copyAccessWidener")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

configurations {
    apiElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
    runtimeElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
}

publishing {
    publications {
        mavenForge(MavenPublication) {
            groupId = "org.valkyrienskies.eureka"
            version = project.version
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
        }
    }
    repositories {
        if (project.vs_maven_username && project.vs_maven_password) {
            maven {
                url = project.vs_maven_url
                credentials {
                    username = project.vs_maven_username
                    password = project.vs_maven_password
                }
            }
        }
    }
}
