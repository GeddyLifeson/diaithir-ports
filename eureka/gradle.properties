org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G
# Java compiles to release 25 (required by MC 26.2) while Kotlin targets bytecode 21 (Kotlin has no
# JVM_25 target yet); downgrade Kotlin's strict target validation from a hard error to a warning.
kotlin.jvm.target.validation.mode=warning
# Identity
mod_name=eureka
mod_id=vs_eureka
eureka_version=1.6.3
# 26.2 fork: NeoForge only (Fabric/legacy Forge dropped, matching the VS2 26.2 fork).
enabled_platforms=neoforge
archives_base_name=eureka-262
maven_group=org.valkyrienskies

# Dependencies
# mojang
minecraft_version=26.2
# vs - the locally-published VS2 26.2 fork (publishToMavenLocal from ../vs2-core).
# common artifact is dev-classified; forge artifact is the plain (main) jar.
vs2_version=2.5.0-26.2-fork+f39132148e
vs_core_version=1.1.0+9ca3f9139c
# neoforge
neoforge_version=26.2.0.12-beta
# architectury API 21.0.3 targets MC 26.2 (fabric-api dep 0.154.2+26.2).
architectury_version=21.0.3
# Kotlin
kotlin_version=2.4.0
# Kotlin for Forge (NeoForge) - 6.3.0 supports NeoForge 26.2.
kotlin_for_forge_version=6.3.0
# Fabric loader kept only for @Environment compile-time annotations (architectury client/server
# code stripping), not to ship a Fabric build - same as the VS2 26.2 fork.
fabric_loader_version=0.19.3
# config screen infra
cloth_config_version=26.2.155
mixin_extras_version=0.4.1
# vs-core transitive physics deps (pinned to match the VS2 fork)
krunch_version=1.0.0+f0bdc63445
krunch_api_version=1.0.0+e0c015f294
# Prevent kotlin from auto-including stdlib as a dependency (breaks composite builds).
kotlin.stdlib.default.dependency=false

# Maven publishing
vs_maven_url=
vs_maven_username=
vs_maven_password=
# For release builds
curse_api_key=
curse_project_id=654384
modrinth_api_key=
modrinth_project_id=EO8aSHxh

# Kotlin incremental compilation corrupts outputs when compileKotlin.destinationDirectory is
# redirected into java/main (the @Mod dev-launch fix): each incremental pass can drop classes
# (EurekaModForge.class, then EurekaModForgeClient.class went missing on disk). Force full
# recompiles - slower but correct.
kotlin.incremental=false
