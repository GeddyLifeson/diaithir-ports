plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = project.mod_version
base.archivesName = 'diaithir-create-gantries-neoforge-26.1.2'
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// The Create port (branch claude/create, mod id diaithir_create) is not on a Maven repository: point this at its jar,
// built with `./gradlew jar` there, e.g. -Pcreate_jar=/path/to/create-neoforge-26.1.2-6.0.9-diaithir.4.jar
def createJar = providers.gradleProperty('create_jar').orElse(providers.environmentVariable('CREATE_JAR')).orNull

neoForge {
    version = project.neo_version
    runs {
        server {
            server()
            programArgument '--nogui'
        }
    }
    mods { diaithirgantries { sourceSet(sourceSets.main) } }
}

dependencies {
    if (createJar != null) {
        compileOnly files(createJar)
        runtimeOnly files(createJar)
    }
}

processResources {
    inputs.property 'version', version
    filesMatching('META-INF/neoforge.mods.toml') { expand(version: version) }
}

jar { from('LICENSE-ExtendedGantries-GPL-3.0'); from('NOTICE') }
