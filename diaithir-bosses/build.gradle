plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = project.mod_version
base.archivesName = 'diaithir-bosses-neoforge-26.1.2'
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version
    runs {
        server {
            server()
            programArgument '--nogui'
            // dev runs and the self test read the Library rites straight from diaithir-druidry's data
            systemProperty 'diaithir.rites', file('../diaithir-druidry/src/main/resources/data/diaithir_druidry/rites').absolutePath
        }
    }
    mods { diaithirbosses { sourceSet(sourceSets.main) } }
}

processResources {
    inputs.property 'version', version
    filesMatching('META-INF/neoforge.mods.toml') { expand(version: version) }
}

repositories {
    mavenCentral()
}
