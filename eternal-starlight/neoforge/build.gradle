apply plugin: "com.gradleup.shadow"

base.archivesName = "eternalstarlight"

loom {
	accessWidenerPath = project(":common").loom.accessWidenerPath
}

architectury {
	platformSetupLoomIde()
	neoForge()
}

configurations {
	common
	shadowCommon
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentNeoForge.extendsFrom common
}

dependencies {
	neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"


	common(project(path: ":common")) { transitive false }
	shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive = false }

}

configurations.all {
	resolutionStrategy.cacheChangingModulesFor 0, "seconds"
}

processResources {
	inputs.property "version", project.version
	from(project(":common").file("src/main/resources/resourcepacks")) { into("resourcepacks") }

	filesMatching("META-INF/neoforge.mods.toml") {
		expand "version": project.version
	}
}

jar {
	archiveClassifier.set("raw")
}

shadowJar {
	exclude "fabric.mod.json"
	exclude "architectury.common.json"

	dependsOn jar
	mainSpec.sourcePaths.clear()
	from(zipTree(jar.archiveFile))
	configurations = [project.configurations.shadowCommon]
	archiveClassifier.set(null)
	zip64 = true
}

assemble.dependsOn shadowJar

shadow.addShadowVariantIntoJavaComponent = false

configurations {
	apiElements {
		outgoing.artifacts.clear()
		outgoing.artifact(shadowJar)
	}
	runtimeElements {
		outgoing.artifacts.clear()
		outgoing.artifact(shadowJar)
	}
}

sourcesJar {
	def commonSources = project(":common").sourcesJar
	dependsOn commonSources
	from commonSources.archiveFile.map { zipTree(it) }
}

publishing {
	publications {
		mavenNeoForge(MavenPublication) {
			artifactId = rootProject.archives_base_name + "-" + project.name
			from components.java
		}
	}

	repositories {
	}
}

// PORT STUB: data generators excluded (see PORT-NOTE.md)
sourceSets.main.java {
	exclude "**/eternalstarlight/neoforge/datagen/**"
}
