dependencies {
	implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
}

architectury {
	common(rootProject.enabled_platforms.split(","))
}

loom {
	accessWidenerPath = file("src/main/resources/eternal_starlight.accesswidener")
}

sourceSets {
	main {
		resources.srcDir project(':common').file('src/generated/resources').absolutePath
	}
}

processResources {
	exclude '.cache/**'
}

// PORT STUB: client rendering code excluded until rewritten for the 26.1 render pipeline (see PORT-NOTE.md)
sourceSets.main.java {
	exclude "**/eternalstarlight/common/item/recipe/AlloyRecipeBuilder.java"
// CLIENT-PORT: packages still excluded; removed one by one as they are ported
	exclude "**/eternalstarlight/common/mixin/client/**"
}
tasks.withType(JavaCompile).configureEach { options.compilerArgs += ["-Xmaxerrs","100000"] }
