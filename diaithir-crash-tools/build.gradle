plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = project.mod_version
base.archivesName = 'diaithir-crash-tools-neoforge-26.1.2'
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version
    runs {
        server {
            server()
            programArgument '--nogui'
        }
    }
    accessTransformers.from('src/main/resources/META-INF/accesstransformer.cfg')
    mods {
        diaithircrashtools { sourceSet(sourceSets.main) }
        simplebackups { sourceSet(sourceSets.main) }
    }
}

processResources {
    inputs.property 'version', version
    filesMatching('META-INF/neoforge.mods.toml') { expand(version: version) }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation(jarJar('org.tukaani:xz:1.12'))
    implementation(jarJar('com.github.luben:zstd-jni:1.5.7-7'))
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'com.google.code.gson:gson:2.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

test {
    useJUnitPlatform()
}
