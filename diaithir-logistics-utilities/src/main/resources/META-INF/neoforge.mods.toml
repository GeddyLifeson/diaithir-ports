[[mods]]
modId = "diaithirlogistics"
version = "${version}"
displayName = "Diaithir Logistics Utilities (Foundry depots)"
description = "Foundry courier depots and ghost placement. Depots serve ghost blocks inside their reach: couriers fetch the item from the chests beside the depot and build the block. Clean-room original."
displayName = "Diaithir Logistics Pipes"
description = "Routed item pipes: connected pipes form a network, sink pipes take items by priority and filter, extractor pipes pull from touching inventories, speed pipes are faster. Port of the design of Not Logistics Pipes (LGPL-3.0)."

[[dependencies.diaithirlogistics]]
modId = "neoforge"
type = "required"
versionRange = "[26.1.2.109,)"
