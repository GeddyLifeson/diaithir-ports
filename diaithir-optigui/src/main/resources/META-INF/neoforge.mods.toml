modLoader = "kotlinforforge"
loaderVersion = "[6,)"
license = "LGPL-3.0-or-later"
issueTrackerURL = "https://github.com/opekope2/OptiGUI/issues"

[[mods]]
modId = "optigui"
version = "${version}"
displayName = "OptiGUI"
logoFile = "assets/optigui/icon.png"
authors = "opekope2"
credits = "Port of OptiGUI by opekope2 (https://github.com/opekope2/OptiGUI, LGPL-3.0-or-later; the 26.1 branch it was ported from carries the MIT text, kept as LICENSE-MIT-upstream-26.1). Contributors: Santiago Hernandez (TheLegendofSaram), dirtTW (yichifauzi), notlin4, Lucanoria. NeoForge 26.1.2 port for Diaithir; upstream code is unchanged apart from the loader glue."
displayURL = "https://github.com/opekope2/OptiGUI"
description = "Custom GUI textures for resource packs, with built-in OptiFine custom GUI (assets/minecraft/optifine/gui/container) support."

[[mixins]]
config = "optigui.mixins.json"

[[dependencies.optigui]]
modId = "neoforge"
type = "required"
versionRange = "[26.1.2.109,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.optigui]]
modId = "kotlinforforge"
type = "required"
versionRange = "[6.3.0,)"
ordering = "NONE"
side = "CLIENT"

# Default GUI textures per container id, read by ContainerDefaultGuiTextureRegistry.
# Other mods can add their own in their [modproperties.<modid>] with the same prefix "optigui:container_default_gui_textures:".
