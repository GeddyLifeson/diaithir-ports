plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = project.mod_version
base.archivesName = 'diaithir-animation-neoforge-26.1.2'
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version
    runs {
        server {
            server()
            programArgument '--nogui'
        }
        client {
            client()
            // headless test: ./gradlew runClient -PjoinArgs="--username Tester --quickPlayMultiplayer 127.0.0.1:25565"
            if (project.hasProperty('joinArgs')) project.property('joinArgs').toString().split(' ').each { programArgument it }
        }
    }
    mods { diaithiranimation { sourceSet(sourceSets.main) } }
}

processResources {
    inputs.property 'version', version
    filesMatching('META-INF/neoforge.mods.toml') { expand(version: version) }
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    // Player Animation Library 1.2.8 (MIT), Modrinth version id QmAdOGjK = PlayerAnimationLibMerged-1.2.8+mc.26.1
    implementation 'maven.modrinth:player-animation-library:QmAdOGjK'
}
