plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = project.mod_version
base.archivesName = 'diaithir-woodvariants-neoforge-26.1.2'
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version
    runs {
        server {
            server()
            programArgument '--nogui'
        }
    }
    mods { diaithirwoodvariants { sourceSet(sourceSets.main) } }
}

def genResources = tasks.register('genResources', Exec) {
    inputs.files('tools/gen.py', 'src/main/resources/data/diaithirwoodvariants/woods.json')
    outputs.dir(layout.buildDirectory.dir('generated/resources'))
    commandLine 'python3', '-I', 'tools/gen.py', layout.buildDirectory.dir('generated/resources').get().asFile.absolutePath
}
sourceSets.main.resources.srcDir(genResources)

processResources {
    inputs.property 'version', version
    filesMatching('META-INF/neoforge.mods.toml') { expand(version: version) }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'com.google.code.gson:gson:2.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

test {
    useJUnitPlatform()
}
