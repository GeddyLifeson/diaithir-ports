[[mods]]
modId = "diaithirwoodvariants"
version = "${version}"
displayName = "Diaithir Wood Variants"
description = "Furnishing and building variants for the modded woods of the pack: chair, stool, bench, table, wall, vertical planks and framed planks, one set per wood. The woods are rows in data/diaithirwoodvariants/woods.json (planks, log and textures of any mod), and a set is only added when that wood's mod is loaded. Clean-room: written from how furniture and chisel-style variant mods behave, no code or art taken from them. Textures are the wood mod's own, referenced in place."

[[dependencies.diaithirwoodvariants]]
