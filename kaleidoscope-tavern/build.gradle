plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = mod_group_id
version = mod_version
base.archivesName = 'kaleidoscope-tavern-neoforge-26.1.2'
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version
    runs {
        server {
            server()
            programArgument '--nogui'
        }
    }
    mods { "${mod_id}" { sourceSet(sourceSets.main) } }
}

processResources {
    var props = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version, mod_license: mod_license, mod_authors: mod_authors,
                 mod_description: mod_description, neo_version_range: neo_version_range, minecraft_version_range: minecraft_version_range,
                 loader_version_range: loader_version_range]
    inputs.properties props
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) { expand props }
}

repositories {
    maven { url = "https://maven.blamejared.com/"; content { includeGroup "mezz.jei" } }
    maven { url = "https://api.modrinth.com/maven"; content { includeGroup "maven.modrinth" } }
}

dependencies {
    compileOnly "mezz.jei:jei-26.1.2-neoforge-api:29.5.0.26"
    compileOnly "maven.modrinth:jade:26.1.1+neoforge"
}
