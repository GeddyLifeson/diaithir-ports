plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = project.mod_version
base.archivesName = 'diaithir-compat-neoforge-26.1.2'
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version
    runs {
        server {
            server()
            programArgument '--nogui'
        }
    }
    mods { diaithircompat { sourceSet(sourceSets.main) } }
}

processResources {
    inputs.property 'version', version
    filesMatching('META-INF/neoforge.mods.toml') { expand(version: version) }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'com.google.code.gson:gson:2.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

test {
    useJUnitPlatform()
    // Optional: a built Tellus classes directory, so the projection test runs against the real EarthProjection.
    systemProperty 'tellus.classes', System.getProperty('tellus.classes', '/home/user/tellus-work/tellus/mc261-neoforge/build/classes/java/main')
    systemProperty 'ranges.dir', "${projectDir}/src/main/resources/data/diaithir/earth_ranges"
}
