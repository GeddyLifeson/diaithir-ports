modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

[[mods]]
modId = "diaithircompat"
version = "${version}"
displayName = "Diaithir Compat"
description = "Pack glue for Diaithir: upgrades recipe data written for Minecraft 1.21.1 so it loads on 26.1.2, and keeps natural spawns inside the geographic ranges in data/*/earth_ranges on the Tellus Earth dimension. Adds the Age I wild plants and wild cereals and pulses the pack lacks, placed by biome and region."

[[dependencies.diaithircompat]]
modId = "neoforge"
type = "required"
versionRange = "[26.1.2.109,)"
