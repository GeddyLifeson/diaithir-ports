import org.jetbrains.kotlin.gradle.tasks.KotlinJvmCompile

buildscript {
    // Lock plugin dependencies
    configurations.classpath {
        resolutionStrategy.activateDependencyLocking()
    }
}

plugins {
    // Minecraft 26.1+ removed obfuscation entirely, so Architectury Loom's classic
    // remap-based pipeline has no mappings to work with (see
    // https://github.com/architectury/architectury-loom/issues/328, still open as of 2026-07).
    // The community-verified path is the `loom-no-remap` plugin variant, which requires the
    // 3.5-SNAPSHOT architectury-plugin. This is bleeding-edge/unofficial tooling, not a stable
    // release - flagged here in case it needs re-evaluating later.
    id "architectury-plugin" version "3.5.170"
    id "dev.architectury.loom-no-remap" version "1.17.491" apply false
    // loom-vineflower removed: Architectury Loom 1.17 ships Vineflower as its built-in decompiler.
    // Bumped from 2.2.20 to 2.4.0 to match kotlinforforge-neoforge 6.3.0's own compiler version
    // (needed for its mods.toml to declare 26.x minecraft compatibility) - an older Kotlin
    // compiler can't read newer compiled-metadata, so both sides must match or exceed it.
    id "org.jetbrains.kotlin.jvm" version "2.4.0" apply false
    id 'com.matthewprenger.cursegradle' version '1.4.0' apply false
    id "com.modrinth.minotaur" version "2.4.3" apply false
}

// Determine the version
if (project.hasProperty("CustomReleaseVersion")) {
    // Remove release/ from the version if present
    version = project.property("CustomReleaseVersion").replaceFirst("^release/1\\.\\d+\\.\\d+/", "")
} else {
    String gitRevision = "git rev-parse HEAD".execute().text.trim()

    version = mod_version + "+" + gitRevision.substring(0, 10)
}

architectury {
    minecraft = rootProject.minecraft_version
}

// Lock dependencies
// https://docs.gradle.org/current/userguide/dependency_locking.html
dependencyLocking {
    lockAllConfigurations()
}

tasks.register("updateVsCore") {
    File versionFile = null
    File gradleProperties = file("gradle.properties")

    try {
        def vsCoreBuild = gradle.includedBuild("vs-core")
        versionFile = new File(vsCoreBuild.projectDir, "internal/build/version.txt")

        inputs.file(versionFile)
        outputs.file(gradleProperties)
        dependsOn(vsCoreBuild.task(":internal:writeVersion"))

        [':impl', ':api', ':internal', ':util'].each {
            dependsOn(vsCoreBuild.task("${it}:publishToMavenLocal"))
        }
    } catch (UnknownDomainObjectException ignore) {}

    onlyIf {
        versionFile != null
    }

    doLast {
        def vsCoreVersion = versionFile.text
        def newGradleProperties = gradleProperties.text.replaceFirst("(?m)^vs_core_version=.*", "vs_core_version=" + vsCoreVersion)
        gradleProperties.write(newGradleProperties)
    }
}

subprojects {
    apply plugin: "dev.architectury.loom-no-remap"
    // Apply checkstyle and ktlint to check the code style of every sub project
    apply plugin: "org.jetbrains.kotlin.jvm"

    repositories {
        try {
            def vsCoreBuild = gradle.includedBuild("vs-core")
            mavenLocal {
                content {
                    includeGroup("org.valkyrienskies.core")
                }
            }

            [':impl', ':api', ':internal'].each {
                compileJava.dependsOn(vsCoreBuild.task("${it}:publishToMavenLocal"))
            }
        } catch (UnknownDomainObjectException ignore) {}

        mavenCentral()
        if (!project.block_external_repositories) {
            maven { url = "https://maven.parchmentmc.org" }
            maven { url = 'https://thedarkcolour.github.io/KotlinForForge/' }
            maven { url = "https://maven.shedaniel.me/" } // Cloth Config
            maven { url = "https://maven.architectury.dev/" }
            maven { url = "https://maven.neoforged.net/releases" }
            maven { url = "https://maven.fabricmc.net/" }
            maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" } // Forge Config API Port
        }
        maven {
            name = "Valkyrien Skies Internal"
            url = project.vs_maven_url ?: 'https://maven.valkyrienskies.org'
            if (project.vs_maven_username && project.vs_maven_password) {
                credentials {
                    username = project.vs_maven_username
                    password = project.vs_maven_password
                }
            }
        }
    }

    // Remove automatically added repos
    if (project.block_external_repositories) {
        repositories.removeIf {
            def url = it.url.toString()
            url.contains("maven.minecraftforge.net") ||
                url.contains("maven.fabricmc.net") ||
                url.contains("maven.architectury.dev")
        }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        // No `mappings` declaration: Minecraft 26.1+ ships unobfuscated, so loom-no-remap has
        // no obfuscated<->named mapping to declare (see plugin block comment above).

        compileOnly("com.google.code.findbugs:jsr305:3.0.2")
    }

    kotlin {
        compilerOptions {
            optIn.add("org.valkyrienskies.core.api.VsBeta")
        }
    }
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    // Set the base name, version, and group to the values in the gradle.properties
    // (archivesBaseName direct assignment was removed in Gradle 9; use the `base` extension.)
    base.archivesName.set(rootProject.archives_base_name.toString())
    version = rootProject.version
    group = rootProject.maven_group

    publishing {
        repositories {
            if (project.vs_maven_username && project.vs_maven_password) {
                println "Publishing to VS Maven ($version)"
                maven {
                    name = "VSMaven"
                    url = project.vs_maven_url
                    credentials {
                        username = project.vs_maven_username
                        password = project.vs_maven_password
                    }
                }
            }
            if (System.getenv("GITHUB_ACTOR") != null) {
                println "Publishing to Github Packages ($version)"
                maven {
                    name = "GitHubPackages"
                    url = uri("https://maven.pkg.github.com/ValkyrienSkies/Valkyrien-Skies-2")
                    credentials {
                        username = System.getenv("GITHUB_ACTOR")
                        password = System.getenv("GITHUB_TOKEN")
                    }
                }
            }
        }
    }

    tasks.withType(JavaCompile) {
        options.encoding = "UTF-8"

        options.release = 25
    }

    tasks.withType(KotlinJvmCompile).configureEach {
        kotlinOptions {
            // Kotlin (as of 2.2.20) doesn't have a JVM_25 bytecode target yet; targeting 21
            // bytecode is fine since JVM 25 runs older-targeted bytecode without issue.
            jvmTarget = "21"
            freeCompilerArgs += "-Xjvm-default=all"
        }
    }

    java {
        withSourcesJar()
    }
}
