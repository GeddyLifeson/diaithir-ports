org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G
# Java compiles to release 25 (required by MC 26.1+) while Kotlin targets bytecode 21 (Kotlin has
# no JVM_25 target yet) - this mismatch is intentional and safe (JVM 25 runs 21-targeted
# bytecode fine), so downgrade Kotlin's strict validation from a hard error to a warning.
kotlin.jvm.target.validation.mode=warning
minecraft_version=26.1.2
enabled_platforms=neoforge
archives_base_name=valkyrienskies-26-1-2
mod_version=2.5.0-diaithir.5
maven_group=org.valkyrienskies.mod

# https://maven.architectury.dev/dev/architectury/architectury/
architectury_version=20.1.17

neoforge_version = 26.1.2.116

# Kept even though we dropped the Fabric platform: common/build.gradle depends on this purely
# for Fabric's @Environment compile-time annotations (architectury's client/server code stripping
# mechanism), not to actually ship a Fabric build.
fabric_loader_version=0.19.3

# TODO: 3rd-party MOD compat (Create, CC:Tweaked, hexcasting, Sodium, etc.) dropped from initial
# scope per migration plan Phase 1/3. Re-add compat-mod version properties here once those mods
# themselves ship 26.2 builds.

# These two are VS2's OWN config-screen infrastructure (not 3rd-party mod compat) - kept.
# Matches the version forge/gradle.properties already pins for the 1.21.1 line (that file
# overrides this one within the forge subproject; this root value is what :common resolves to).
# TODO Phase 3: verify whether NeoForge 26.2's native config screen support makes fcap unnecessary.
cloth_config_version=26.1.154
fcap_version = 21.1.0

sable_version=1.1.3

vs_core_version=1.1.0+9ca3f9139c
# Ideally we'd determine these automatically from vs_core. Add them manually for now
krunch_version=1.0.0+f0bdc63445
krunch_api_version=1.0.0+e0c015f294
# Prevent kotlin from autoincluding stdlib as a dependency, which breaks
# gradle's composite builds (includeBuild) for some reason. We'll add it manually
kotlin.stdlib.default.dependency=false
# Left intentionally empty
vs_maven_url=
vs_maven_username=
vs_maven_password=
curse_api_key=
curse_project_id=258371
modrinth_api_key=
modrinth_project_id=V5ujR2yw
# This is set to true in CI, to ensure that VS doesn't rely on a maven hosted in someone's basement to build
# you can also set it to true if some external maven is misbehaving (forge I'm looking @ u)
block_external_repositories=

# compileKotlin.destinationDirectory is redirected into compileJava's output (so @Mod Kotlin
# objects get constructed in dev launch). That redirect is incompatible with Kotlin incremental
# compilation: incremental passes silently drop previously-emitted classes from disk, which shows
# up at runtime as NoClassDefFoundError / UninitializedPropertyAccessException (e.g. vsCoreProvider)
# with no compile-time symptom. Disable incremental compilation entirely.
kotlin.incremental=false
