[[mods]]
modId = "diaithirwaypoints"
version = "${version}"
displayName = "Diaithir Waypoints"
description = "Waystones as a path through the world: stand beside a waypoint stone to light it, then walk the paths you have lit from any other stone or with a return scroll. Clean-room; written from how waystone mods behave, no code or art taken from them."

