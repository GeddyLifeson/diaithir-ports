plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
repositories { mavenCentral() }
neoForge {
    version = project.neo_version
    runs {
        server { server(); programArgument '--nogui' }
        client { client(); if (project.hasProperty('quickmp')) { programArguments.addAll('--quickPlayMultiplayer', project.property('quickmp')) }; if (project.hasProperty('quickplay')) { programArguments.addAll('--quickPlaySingleplayer', project.property('quickplay')) } }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }
    mods { "${mod_id}" { sourceSet(sourceSets.main) } }
}
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    testImplementation 'com.google.code.gson:gson:2.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath
test { useJUnitPlatform() }
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var p = [minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
             neo_version: neo_version, loader_version_range: loader_version_range, mod_id: mod_id,
             mod_name: mod_name, mod_license: mod_license, mod_version: project.version,
             mod_authors: mod_authors, mod_description: mod_description]
    inputs.properties p
    expand p
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
tasks.withType(JavaCompile).configureEach { options.encoding = "UTF-8"; options.release.set(25); options.compilerArgs += ['-Xmaxerrs', '100000'] }
