plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = project.mod_version
base.archivesName = 'diaithir-vehicles-crayfish-neoforge-26.1.2'
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version
    runs {
        server {
            server()
            programArgument '--nogui'
        }
    }
    mods {
        diaithirvehiclescrayfish { sourceSet(sourceSets.main) }
    }
}

processResources {
    inputs.property 'version', version
    filesMatching('META-INF/neoforge.mods.toml') { expand(version: version) }
}

repositories {
    mavenCentral()
}

dependencies {
    // The shared fuel capability (MIT). Substituted from ../diaithir-vehicles by the included build.
    implementation 'net.diaithir:diaithir-vehicles'
    implementation 'net.diaithir:diaithir-units:1.0.0'
    implementation 'net.diaithir:diaithir-bridges:1.0.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

test {
    useJUnitPlatform()
}
