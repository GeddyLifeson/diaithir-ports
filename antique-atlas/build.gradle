plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'folk.sisby'
version = project.mod_version
base.archivesName = 'antique-atlas'
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

def surveyorJar = fileTree('../surveyor/build/libs') { include 'surveyor-*.jar'; exclude '*-sources.jar' }

neoForge {
    version = project.neo_version
    mods { antique_atlas { sourceSet(sourceSets.main) } }
}

processResources {
    inputs.property 'version', version
    filesMatching('META-INF/neoforge.mods.toml') { expand(version: version) }
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly surveyorJar
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation surveyorJar
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    from('LICENSE') { rename { 'LICENSE_antique_atlas' } }
    from('CREDITS') { rename { 'CREDITS_antique_atlas' } }
}

test {
    useJUnitPlatform()
}

tasks.register('printCp') {
    def cp = sourceSets.main.compileClasspath
    doLast { file("$buildDir/cp.txt").text = cp.asPath }
}
