# Publishing a release sends each attached jar to Modrinth and CurseForge.
# publish.json maps a jar file-name prefix to its project ids: {"ironchest-": {"modrinth": "...", "curseforge": 123}}.
name: publish
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      jars: ${{ steps.plan.outputs.jars }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          gh release view "$TAG" --json assets -q '.assets[].name' > assets.txt
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          ids = json.load(open("publish.json"))
          jars = []
          for name in open("assets.txt").read().split():
              hit = [p for p in ids if name.startswith(p)]
              if name.endswith(".jar") and hit:
                  jars.append({"file": name, **ids[max(hit, key=len)]})
          print("jars=" + json.dumps(jars))
          PY
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
  publish:
    needs: plan
    if: needs.plan.outputs.jars != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        jar: ${{ fromJson(needs.plan.outputs.jars) }}
    steps:
      - run: gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "${{ matrix.jar.file }}"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
      - uses: Kir-Antipov/mc-publish@v3.3
        with:
          files: ${{ matrix.jar.file }}
          loaders: neoforge
          game-versions: 26.1.2
          modrinth-id: ${{ matrix.jar.modrinth }}
          modrinth-token: ${{ matrix.jar.modrinth && secrets.MODRINTH_TOKEN || '' }}
          curseforge-id: ${{ matrix.jar.curseforge }}
          curseforge-token: ${{ matrix.jar.curseforge && secrets.CURSEFORGE_TOKEN || '' }}
