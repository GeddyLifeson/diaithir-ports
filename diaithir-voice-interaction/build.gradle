plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = project.mod_version
base.archivesName = 'diaithir-voice-interaction-neoforge-26.1.2'
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version
    runs {
        server {
            server()
            programArgument '--nogui'
        }
    }
    mods { diaithirvoiceinteraction { sourceSet(sourceSets.main) } }
}

processResources {
    inputs.property 'version', version
    filesMatching('META-INF/neoforge.mods.toml') { expand(version: version) }
}

repositories {
    mavenCentral()
    // Simple Voice Chat publishes its plugin API here; it is only a compile-time dependency, nothing is bundled.
    maven { url = 'https://maven.maxhenkel.de/repository/public' }
}

dependencies {
    compileOnly 'de.maxhenkel.voicechat:voicechat-api:2.6.25'
    // diaithir-voice's SpeechEvent: build ../diaithir-voice first. Compile-time only, the mod is optional at run time.
    compileOnly fileTree(dir: '../diaithir-voice/build/libs', include: '*.jar')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'com.google.code.gson:gson:2.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

test {
    useJUnitPlatform()
}
