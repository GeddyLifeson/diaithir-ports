displayName = "Diaithir Èistechd (Voice Interaction)"
description = "Creatures of the wild notice speech. Talking makes a vibration that sculk sensors and wardens hear, wolves and villagers turn to look, foxes and rabbits shy away, and sneaking keeps you quiet. Works with Simple Voice Chat through its plugin API and with diaithir-voice. Clean-room: written from the described behaviour of voice-interaction addons, no code taken from any of them."

[[dependencies.diaithirvoiceinteraction]]
