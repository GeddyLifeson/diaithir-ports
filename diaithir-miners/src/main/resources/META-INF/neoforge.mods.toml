modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

[[mods]]
modId = "diaithirminers"
version = "${version}"
displayName = "Diaithir Miners"
authors = "samllea1 (Advanced Ore Deposits, MIT), Seraphaestus (FactoriOres, MIT), Diaithir"
description = "Factorio-style ore patches with a finite count per block, plus burner and electric miners. Port and merge of Advanced Ore Deposits and FactoriOres, with our own 64 px Industrial Factory art."

[[dependencies.diaithirminers]]
modId = "neoforge"
type = "required"
versionRange = "[26.1.2.109,)"

[[mods]]
modId = "oredetector"
version = "${version}"
displayName = "Ore Detector (folded)"
authors = "Pinter Gabor (MIT), folded by Diaithir"
description = "Coal, iron, gold, diamond and void detectors: use one on a block and it bangs, then echoes how far the nearest matching ore is. Folded from pintergabor/oredetector (MIT), mixins replaced by a server tick queue."

[[dependencies.oredetector]]
modId = "neoforge"
type = "required"
versionRange = "[26.1.2.109,)"
ordering = "NONE"
side = "BOTH"
