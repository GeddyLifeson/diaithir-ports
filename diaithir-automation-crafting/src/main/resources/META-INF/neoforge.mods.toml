modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT AND LGPL-3.0-or-later"

[[mods]]
modId = "researcher"
version = "${version}"
displayName = "Researcher (Diaithir Automation and Crafting)"
authors = "Tr100000; NeoForge port for Diaithir"
description = "A data-driven research tree inspired by Factorio. Ported from Tr100000's Researcher (MIT) to NeoForge 26.1.2 as the research bench of the Diaithir automation and crafting module."
logoFile = "assets/researcher/icon.png"

[[mods]]
modId = "diaithirautomationcrafting"
version = "${version}"
displayName = "Diaithir Automation and Crafting"
description = "Research and bulk crafting: Researcher, Packager and Unpackager benches. Port of The Package Mod by whizzball1 (LGPL-3.0) to NeoForge 26.1.2; packages are datapack JSON and research is shared by the whole server."

[[mixins]]
config = "researcher.mixins.json"

[[mixins]]
config = "researcher.client.mixins.json"

[[dependencies.researcher]]
modId = "neoforge"
type = "required"
versionRange = "[26.1.2.109,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.diaithirautomationcrafting]]
modId = "neoforge"
type = "required"
versionRange = "[26.1.2.109,)"
ordering = "NONE"
side = "BOTH"
