plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = project.mod_version
base.archivesName = 'diaithir-automation-crafting-neoforge-26.1.2'
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version
    accessTransformers.from('src/main/resources/META-INF/accesstransformer.cfg')
    interfaceInjectionData.from('src/main/resources/interfaces.json')
    runs {
        server {
            server()
            programArgument '--nogui'
        }
        client {
            client()
            if (project.hasProperty('joinServer')) {
                programArguments.addAll('--username', 'Researcher', '--quickPlayMultiplayer', project.property('joinServer'))
            }
        }
    }
    mods { researcher { sourceSet(sourceSets.main) } }
}

processResources {
    inputs.property 'version', version
    filesMatching('META-INF/neoforge.mods.toml') { expand(version: version) }
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly 'org.jetbrains:annotations:26.0.2'
    compileOnly 'org.jspecify:jspecify:1.0.0'
}
