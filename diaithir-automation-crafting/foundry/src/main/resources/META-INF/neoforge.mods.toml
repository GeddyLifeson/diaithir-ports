modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

[[mods]]
modId = "diaithircrafting"
version = "${version}"
displayName = "Diaithir Automation and Crafting: Foundry"
description = "Foundry parts for the automation and crafting module: the Operator Seat (machines need a food-fed worker) and the research packs 1 to 7 that feed the Age gates. Our own clean-room design."

[[dependencies.diaithircrafting]]
modId = "neoforge"
type = "required"
versionRange = "[26.1.2.109,)"

[[mods]]
modId = "diaithir_stations"
version = "${version}"
displayName = "Diaithir Stations"
description = "Station framework: data-driven station recipes (part, assembly, process) and the Foundry stations hearth bench, wright bench, smeltery, steam forge and fabricator. Our own clean-room design."

[[dependencies.diaithir_stations]]
modId = "neoforge"
type = "required"
versionRange = "[26.1.2.109,)"

[[mods]]
modId = "diaithir_materials"
version = "${version}"
displayName = "Diaithir Building Materials"
description = "Building materials by Age from one shared property table (density, strength, fire, blast, heat conductance): the concrete line so far. Our own clean-room design."

[[dependencies.diaithir_materials]]
modId = "neoforge"
type = "required"
versionRange = "[26.1.2.109,)"

[[dependencies.diaithir_materials]]
modId = "diaithir_stations"
type = "required"
versionRange = "[1.0.0,)"
ordering = "AFTER"
side = "BOTH"
